<!doctype html>

<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&amp;display=swap"
      rel="stylesheet"
    />
    <link type="text/css" rel="stylesheet" href="style.css" />
    <title>Sakiju-chan links</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <div class="container text-center bg-transparent">
      <div class="header-container">
        <h1 class="title">
          Saki~
          <span class="purple-heart" aria-label="Purple heart"
            >&#x2665;&#xFE0E;</span
          >
        </h1>
        <div
          style="
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: -12px;
          "
        >
          <a
            href="https://www.instagram.com/sakiju.chann"
            target="_blank"
            class=""
            ><img
              style="vertical-align: text-bottom"
              src="instagram.svg"
              width="40"
            />
          </a>
          <a href="https://www.tiktok.com/@therealsaki" target="_blank" class=""
            ><img
              style="vertical-align: text-bottom"
              src="tiktok.svg"
              width="40"
            />
          </a>
        </div>
      </div>
      <div class="text-center social-link-buttons">
        <a
          target="_blank"
          class="btn btn-block btn-lg btn-outline color-light shake"
          style="font-weight: 800"
          >Loading discount...</a
        >
        <a
          target="_blank"
          class="btn btn-block btn-lg btn-outline color-light shake"
          >Loading discount...</a
        >
      </div>
    </div>

    <div class="gradient-bg">
      <div class="stars"></div>
    </div>

    <script>
      function getUrlParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name) || null;
      }

      const utmSource = getUrlParam("utm_source");

      function extractFolderFromURL() {
        const [, folder] = window.location.pathname.split(/^\/([^/]+)/);

        if (folder) {
          return folder;
        }

        // If no folder found, return null or an appropriate default value
        return null;
      }

      const dynamicLinksObj = {
        default: [
          {
            index: 0,
            text: "50% Discount OF! 🤫",
            href: "https://onlyfans.com/sakiju.chan",
          },
          {
            index: 1,
            text: "50% Discount Fanslee! 😏",
            href: "https://fansly.com/r/Sakijuchan",
          },
        ],
        tiktok: [
          {
            index: 0,
            text: "50% Discount OF! 🤫",
            href: "https://onlyfans.com/sakiju.chan/c3",
          },
          {
            index: 1,
            text: "50% Discount Fanslee! 😏",
            href: "https://fansly.com/Sakijuchan/t1",
          },
        ],
        instagram: [
          {
            index: 0,
            text: "50% Discount OF! 🤫",
            href: "https://onlyfans.com/sakiju.chan/c2",
          },
          {
            index: 1,
            text: "50% Discount Fanslee! 😏",
            href: "https://fansly.com/Sakijuchan/t0",
          },
        ],
      };

      const socialButtons = document.querySelectorAll(
        ".social-link-buttons > .btn",
      );

      const folderLinkMap = {
        more: "tiktok", //tiktok
        discount: null, //reddit
        "sign-up": null, //twitter
        links: null, //insta
        //'bonus-video': null
      };

      const folder = extractFolderFromURL() || "";

      function isMobileDevice() {
        return (
          typeof window.orientation !== "undefined" ||
          navigator.userAgent.indexOf("IEMobile") !== -1
        );
      }

      window.addEventListener("load", (event) => {
        setTimeout(() => {
          let dynamicLinkKey = folderLinkMap[folder] ?? "default";

          if (utmSource === "ig") dynamicLinkKey = "instagram";

          const dynamicLinks =
            dynamicLinksObj[dynamicLinkKey] ?? dynamicLinksObj.default;

          for (link of dynamicLinks) {
            const text = link.text;
            const href = link.href;
            const index = link.index;

            if (text) socialButtons[index].innerText = text;
            if (href) socialButtons[index].setAttribute("href", href);
          }

          //if (ofOrigins[folder]) socialButtons[0].href += ofOrigins[folder];

          if (isMobileDevice()) {
            const infoBox = document.querySelector(".info-wrapper");
            const logo = document.querySelector(".logo");
            infoBox.classList.add("show");
            logo.classList.add("transparent");
          }
        }, 900);
      });

      const starsEl = document.querySelector(".stars");
      const stars = 1200;
      const r = 800;

      let html = "";

      for (let i = 0; i < stars; i++) {
        const scale = 0.2 + Math.random();
        const curR = r + Math.random() * 300;

        // Spread stars throughout the full upper hemisphere.
        const rotateX = Math.random() * -90;
        const rotateY = Math.random() * 360;

        const css = `
    transform-origin: 0 0 ${curR}px;
    transform:
      translate3d(0, 0, -${curR}px)
      rotateY(${rotateY}deg)
      rotateX(${rotateX}deg)
      scale(${scale});
  `;

        html += `<div class="star" style="${css}"></div>`;
      }

      starsEl.innerHTML = html;
    </script>
